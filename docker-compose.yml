version: '3.9'

services:
  backend:
    build:
      context: .
      target: production
    container_name: chat-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - '${PORT:-5000}:5000'
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - chat-network

  mongo:
    image: mongo:7
    container_name: chat-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: chat-app
    volumes:
      - mongo-data:/data/db
    ports:
      - '27017:27017'
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chat-network

volumes:
  mongo-data:

networks:
  chat-network:
    driver: bridge
